name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/guestspot

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend build (tsc + vite)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: PocketBase JS syntax check
        run: |
          for f in pb/pb_hooks/*.pb.js pb/pb_migrations/*.js pb/pb_hooks/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done

  smoke:
    name: Smoke test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & start stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Run smoke test
        env:
          BASE: http://localhost:8080
          PB_ADMIN_EMAIL: admin@example.com
          PB_ADMIN_PASSWORD: change-me
        run: bash scripts/smoke.sh

      - name: Tear down
        if: always()
        run: docker compose down -v

  docker:
    name: Build & push images
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (backend)
        id: meta-pb
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-pb
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Docker metadata (frontend)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./pb
          file: ./pb/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-pb.outputs.tags }}
          labels: ${{ steps.meta-pb.outputs.labels }}

      - name: Build & push frontend
        # Web image is amd64-only: the node:22-alpine build crashes under QEMU
        # on arm64 (illegal instruction). It's a static nginx bundle, so ARM
        # hosts can still run it via Docker's emulation layer.
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
