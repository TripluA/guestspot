server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep redirects relative so the client's own host:port is preserved
  absolute_redirect off;

  # Security headers
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws:; img-src 'self' data: blob:; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # PocketBase API + admin. Also carries the realtime SSE stream
  # (/api/realtime): buffering must be off and the read timeout long so
  # idle keep-alive connections aren't killed by the 60s default.
  location /api/ {
    proxy_pass http://pb:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 24h;
    proxy_set_header Connection "";
  }

  location /_/ {
    proxy_pass http://pb:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location / {
    try_files $uri /index.html;
  }
}
